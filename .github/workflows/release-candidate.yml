name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out selected revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install known-good release dependency roots
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet --upgrade -r runtime/python/constraints/known-good.txt

      - name: Resolve dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-release-dependencies
          mkdir -p /tmp/manager-release-dependencies
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest /tmp/manager-release-dependencies \
            -r runtime/python/constraints/known-good.txt

      - name: Build and verify release candidate from clean source
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdx
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/build_release_candidate.py \
            --dependency-dir /tmp/manager-release-dependencies \
            --output release-candidate
          python scripts/verify_release_candidate.py release-candidate \
            --expected-commit "${GITHUB_SHA}" \
            --pyproject runtime/python/pyproject.toml
          python -m pip install --disable-pip-version-check --no-index \
            --find-links release-candidate/dependencies \
            --require-hashes \
            --target /tmp/manager-locked-dependencies \
            -r release-candidate/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps \
            --target /tmp/manager-rc-install release-candidate/artifacts/*.whl
          PYTHONPATH=/tmp/manager-rc-install python - <<'PY'
          import manager_runtime
          assert manager_runtime.__all__
          PY

      - name: Write candidate evidence summary
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum release-candidate/candidate-manifest.json | awk '{print $1}')"
          lock_sha="$(sha256sum release-candidate/dependencies.lock.json | awk '{print $1}')"
          sbom_sha="$(sha256sum release-candidate/sbom.cdx.json | awk '{print $1}')"
          {
            echo '### Release candidate evidence'
            echo ''
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- candidate manifest SHA-256: \`${manifest_sha}\`"
            echo "- dependency lock SHA-256: \`${lock_sha}\`"
            echo "- SBOM SHA-256: \`${sbom_sha}\`"
            echo '- publication: **not authorized by this workflow**'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manager-release-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
