name: Publish approved Python release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Workflow run ID that produced the verified release-candidate artifact"
        required: true
        type: string
      commit_sha:
        description: "Exact approved release commit SHA"
        required: true
        type: string
      version:
        description: "Exact approved package version"
        required: true
        type: string
      candidate_manifest_sha256:
        description: "SHA-256 of candidate-manifest.json reviewed by the maintainer"
        required: true
        type: string
      changelog_sha256:
        description: "SHA-256 of CHANGELOG.md at the approved commit"
        required: true
        type: string
      destination:
        description: "Approved publication destination"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi

permissions:
  contents: read

jobs:
  verify-approved-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate authorization input syntax
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CHANGELOG_SHA256: ${{ inputs.changelog_sha256 }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "candidate_run_id must be a positive integer" >&2; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a lowercase 40-hex Git commit" >&2; exit 1; }
          [[ "${CANDIDATE_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "candidate_manifest_sha256 must be lowercase SHA-256" >&2; exit 1; }
          [[ "${CHANGELOG_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "changelog_sha256 must be lowercase SHA-256" >&2; exit 1; }
          [[ "${RELEASE_VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]] || { echo "version has an unsupported release-input form" >&2; exit 1; }
          test "${RELEASE_DESTINATION}" = "pypi"

      - name: Verify candidate workflow run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          run_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '.path')"
          run_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '.head_sha')"
          run_event="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '.event')"
          run_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '.status')"
          run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '.conclusion')"
          test "${run_path}" = ".github/workflows/release-candidate.yml" || { echo "candidate_run_id is not a release-candidate workflow run" >&2; exit 1; }
          test "${run_head}" = "${RELEASE_SHA}" || { echo "candidate workflow commit does not match approved commit" >&2; exit 1; }
          test "${run_event}" = "workflow_dispatch" || { echo "candidate workflow was not explicitly dispatched" >&2; exit 1; }
          test "${run_status}" = "completed" || { echo "candidate workflow is not completed" >&2; exit 1; }
          test "${run_conclusion}" = "success" || { echo "candidate workflow did not succeed" >&2; exit 1; }

      - name: Check out exact approved commit and current main
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${RELEASE_SHA}" main
          git checkout --detach "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA}" || {
            echo "approved release commit is no longer the current main head" >&2
            exit 1
          }

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manager-release-candidate-${{ inputs.commit_sha }}
          path: release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate, version, changelog, and approval fingerprint
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CHANGELOG_SHA256: ${{ inputs.changelog_sha256 }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
        run: |
          set -euo pipefail
          test "${RELEASE_DESTINATION}" = "pypi"
          python scripts/verify_release_candidate.py release-candidate \
            --expected-commit "${RELEASE_SHA}" \
            --expected-version "${RELEASE_VERSION}" \
            --expected-manifest-sha256 "${CANDIDATE_MANIFEST_SHA256}" \
            --pyproject runtime/python/pyproject.toml \
            --changelog CHANGELOG.md \
            --expected-changelog-sha256 "${CHANGELOG_SHA256}"

      - name: Require successful repository-integrity CI on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          required_run_id="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow repository-integrity.yml \
            --commit "${RELEASE_SHA}" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          test -n "${required_run_id}" || {
            echo "no successful Repository integrity push run exists for ${RELEASE_SHA}" >&2
            exit 1
          }

      - name: Record authorization evidence for protected-environment review
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CHANGELOG_SHA256: ${{ inputs.changelog_sha256 }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
        run: |
          {
            echo '### Release authorization packet'
            echo ''
            echo "- candidate workflow run: \`${CANDIDATE_RUN_ID}\`"
            echo "- commit: \`${RELEASE_SHA}\`"
            echo "- version: \`${RELEASE_VERSION}\`"
            echo "- candidate manifest SHA-256: \`${CANDIDATE_MANIFEST_SHA256}\`"
            echo "- changelog SHA-256: \`${CHANGELOG_SHA256}\`"
            echo "- destination: \`${RELEASE_DESTINATION}\`"
            echo '- required CI: successful `Repository integrity` push run on the exact commit'
            echo '- next boundary: protected `pypi-release` environment approval'
          } >> "${GITHUB_STEP_SUMMARY}"

  publishing-disabled:
    needs: verify-approved-candidate
    if: ${{ vars.MANAGER_PYPI_TRUSTED_PUBLISHING_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse publication until repository setup is explicitly enabled
        shell: bash
        run: |
          echo "Trusted publishing is intentionally disabled. Configure the protected pypi-release environment, PyPI trusted publisher, and MANAGER_PYPI_TRUSTED_PUBLISHING_ENABLED=true before attempting publication." >&2
          exit 1

  publish:
    needs: verify-approved-candidate
    if: ${{ vars.MANAGER_PYPI_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi-release
      url: https://pypi.org/project/manager-reference-runtime/
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Re-check exact release source after environment approval
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${RELEASE_SHA}" main
          git checkout --detach "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA}" || {
            echo "main moved after release review; prior approval is stale" >&2
            exit 1
          }

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Re-download exact approved candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manager-release-candidate-${{ inputs.commit_sha }}
          path: release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Re-verify approval binding immediately before publication
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CHANGELOG_SHA256: ${{ inputs.changelog_sha256 }}
        run: |
          set -euo pipefail
          python scripts/verify_release_candidate.py release-candidate \
            --expected-commit "${RELEASE_SHA}" \
            --expected-version "${RELEASE_VERSION}" \
            --expected-manifest-sha256 "${CANDIDATE_MANIFEST_SHA256}" \
            --pyproject runtime/python/pyproject.toml \
            --changelog CHANGELOG.md \
            --expected-changelog-sha256 "${CHANGELOG_SHA256}"

      - name: Re-check required CI immediately before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          required_run_id="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow repository-integrity.yml \
            --commit "${RELEASE_SHA}" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          test -n "${required_run_id}" || {
            echo "required Repository integrity run is no longer available for ${RELEASE_SHA}" >&2
            exit 1
          }

      - name: Create keyless GitHub build provenance attestation for package artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-candidate/artifacts/*

      - name: Create keyless attestation for candidate approval manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-candidate/candidate-manifest.json

      - name: Publish package with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-candidate/artifacts/
