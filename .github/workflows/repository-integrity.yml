name: Repository integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out event revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run repository integrity checks
        shell: bash
        run: python3 scripts/repository_integrity.py

      - name: Compile Python reference runtime
        shell: bash
        run: python3 -m compileall -q runtime/python scripts/schema_conformance.py

      - name: Run Python reference runtime unit tests
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -v

      - name: Run deterministic behavioral evals
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m manager_runtime.evals evals/cases

      - name: Install schema conformance dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema>=4.23,<5'

      - name: Validate contracts and emitted runtime artifacts
        shell: bash
        run: PYTHONPATH=runtime/python python3 scripts/schema_conformance.py
