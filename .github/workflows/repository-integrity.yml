name: Repository integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out event revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run repository integrity checks
        shell: bash
        run: python3 scripts/repository_integrity.py

      - name: Compile Python reference runtime
        shell: bash
        run: python3 -m compileall -q runtime/python scripts/schema_conformance.py

      - name: Run Python reference runtime unit tests
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -v

      - name: Run deterministic behavioral evals
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m manager_runtime.evals evals/cases

      - name: Install schema conformance dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema>=4.23,<5'

      - name: Validate contracts and emitted runtime artifacts
        shell: bash
        run: PYTHONPATH=runtime/python python3 scripts/schema_conformance.py

      - name: Build and import Python distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-wheel /tmp/manager-install
          mkdir -p /tmp/manager-wheel /tmp/manager-install
          python3 -m pip wheel --disable-pip-version-check --no-deps --wheel-dir /tmp/manager-wheel runtime/python
          python3 -m pip install --disable-pip-version-check --no-deps --target /tmp/manager-install /tmp/manager-wheel/*.whl
          PYTHONPATH=/tmp/manager-install python3 - <<'PY'
          import manager_runtime
          assert manager_runtime.__all__
          PY

      - name: Install optional MCP transport dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet -e 'runtime/python[mcp]'

      - name: Run MCP stdio transport conformance
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_transport_conformance.py' -v

      - name: Run MCP Streamable HTTP transport conformance
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_streamable_http_conformance.py' -v
