name: Repository integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out event revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile reference runtime
        shell: bash
        run: python -m compileall -q runtime/python scripts/schema_conformance.py scripts/build_release_candidate.py scripts/verify_release_candidate.py

      - name: Run unit tests
        shell: bash
        run: PYTHONPATH=runtime/python python -m unittest discover -s runtime/python/tests -v

      - name: Run deterministic behavioral evals
        shell: bash
        run: PYTHONPATH=runtime/python python -m manager_runtime.evals evals/cases

      - name: Build and import wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-wheel /tmp/manager-install
          mkdir -p /tmp/manager-wheel /tmp/manager-install
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir /tmp/manager-wheel runtime/python
          python -m pip install --disable-pip-version-check --no-deps --target /tmp/manager-install /tmp/manager-wheel/*.whl
          PYTHONPATH=/tmp/manager-install python - <<'PY'
          import manager_runtime
          assert manager_runtime.__all__
          PY

  public-safety:
    needs: python-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out event revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run repository integrity checks
        shell: bash
        run: python3 scripts/repository_integrity.py

      - name: Compile Python reference runtime and release tooling
        shell: bash
        run: python3 -m compileall -q runtime/python scripts/schema_conformance.py scripts/build_release_candidate.py scripts/verify_release_candidate.py

      - name: Run Python reference runtime unit tests
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -v

      - name: Run deterministic behavioral evals
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m manager_runtime.evals evals/cases

      - name: Set up release Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install known-good release dependency roots
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet --upgrade -r runtime/python/constraints/known-good.txt

      - name: Validate contracts and emitted runtime artifacts
        shell: bash
        run: PYTHONPATH=runtime/python python3 scripts/schema_conformance.py

      - name: Resolve release dependency wheelhouse twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-deps-a /tmp/manager-deps-b
          mkdir -p /tmp/manager-deps-a /tmp/manager-deps-b
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest /tmp/manager-deps-a -r runtime/python/constraints/known-good.txt
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest /tmp/manager-deps-b -r runtime/python/constraints/known-good.txt

      - name: Build reproducible release candidate twice from clean source
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdx
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/build_release_candidate.py --dependency-dir /tmp/manager-deps-a --output /tmp/manager-rc-a
          git clean -fdx
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/build_release_candidate.py --dependency-dir /tmp/manager-deps-b --output /tmp/manager-rc-b --compare-to /tmp/manager-rc-a
          python3 scripts/verify_release_candidate.py /tmp/manager-rc-a \
            --expected-commit "${GITHUB_SHA}" \
            --pyproject runtime/python/pyproject.toml

      - name: Prove offline hash-locked dependency reconstruction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-offline-install /tmp/manager-rc-install /tmp/manager-sdist-wheel
          mkdir -p /tmp/manager-offline-install /tmp/manager-rc-install /tmp/manager-sdist-wheel
          python3 -m pip install --disable-pip-version-check --no-index \
            --find-links /tmp/manager-rc-a/dependencies \
            --require-hashes \
            --target /tmp/manager-offline-install \
            -r /tmp/manager-rc-a/requirements.lock
          python3 -m pip install --disable-pip-version-check --no-deps --target /tmp/manager-rc-install /tmp/manager-rc-a/artifacts/*.whl
          PYTHONPATH=/tmp/manager-rc-install python3 - <<'PY'
          import manager_runtime
          assert manager_runtime.__all__
          PY
          python3 -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation \
            --wheel-dir /tmp/manager-sdist-wheel /tmp/manager-rc-a/artifacts/*.tar.gz

      - name: Run MCP stdio transport conformance
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_transport_conformance.py' -v

      - name: Run MCP Streamable HTTP transport conformance
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_streamable_http_conformance.py' -v

      - name: Attack MCP hostile boundaries
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_hostile_boundaries.py' -v

      - name: Attack MCP hostile stdio transport
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_hostile_stdio_transport.py' -v

      - name: Attack MCP hostile HTTP transport
        shell: bash
        run: PYTHONPATH=runtime/python python3 -m unittest discover -s runtime/python/tests -p 'test_mcp_hostile_http_transport.py' -v
