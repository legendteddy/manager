[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manager-reference-runtime"
version = "0.7.0"
description = "Python reference control-plane, governed tool, durable approval, resumable bounded agent-loop, and conformance runtime for Manager"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
openai = ["openai>=3.20,<4"]
conformance = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["manager_runtime*"]
